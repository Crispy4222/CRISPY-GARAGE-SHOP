name: Termux diagnostic checks

on:
  pull_request:
    paths:
      - 'docs/scripts/termux-diagnostic.sh'
      - 'tests/termux-diagnostic-smoke.sh'
      - '.github/workflows/termux-diagnostic.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/scripts/termux-diagnostic.sh'
      - 'tests/termux-diagnostic-smoke.sh'
      - '.github/workflows/termux-diagnostic.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n docs/scripts/termux-diagnostic.sh tests/termux-diagnostic-smoke.sh
      - name: Run read-only smoke checks
        run: bash tests/termux-diagnostic-smoke.sh
